name: test-harness

on:
  pull_request:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '.github/workflows/**'



jobs:
   test-harness:
    runs-on: self-hosted
    concurrency:
      group: ${{ github.ref }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v3
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
    # - name: Check anvil exists
    #   run: anvil --version
    - name: Run anvil test
      run: cargo test --package test-harness --lib -- tests::test_start_callapi_stop_python_serve
      # run: RUST_LOG=info cargo test --package test-harness
