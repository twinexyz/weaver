name: PipelineTriggerFromTwineSolidityContracts

on:
  repository_dispatch:
    types: [trigger_changes] # Custom event type

env:
  REPO: twine-solidity-contracts
  ORG: ${{ github.repository_owner }}

jobs:
  run_pipeline:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Checkout twine-soladitiy-contracts repo
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ env.ORG }}/${{ env.REPO }}
          path: ${{ env.REPO }}
          token: ${{ secrets.GH_ACTION_PAT  }}
          ref: main

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.4.0

      - name: Run EVM Scripts
        id: changes
        run: |
          BRANCH_NAME="auto-update-$(date +%s)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          cd twine-solidity-contracts
          ./script/updateSp1Version.sh
          cd ../
          cat twine-solidity-contracts/out/L1MessageQueue.sol/L1MessageQueue.json | jq -r .abi > crates/evm-contracts/artifacts/L1MessageQueue.json
          cat twine-solidity-contracts/out/TwineChain.sol/TwineChain.json | jq -r .abi > crates/evm-contracts/artifacts/TwineChain.json
          cat twine-solidity-contracts/out/L2TwineMessenger.sol/L2TwineMessenger.json | jq -r .abi > crates/evm-contracts/artifacts/L2TwineMessenger.json
          cat twine-solidity-contracts/out/TwineSystemStorageContract.sol/TwineSystemStorageContract.json | jq -r .abi > crates/evm-contracts/artifacts/TwineSystemStorageContract.json
          #cleanup
          rm -rf twine-solidity-contracts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.changes.outputs.branch_name }}
          delete-branch: true
          base: main
          title: "evm contract updates from workflow"
          body: |
            This PR was automatically created by a workflow.
            **Changes:**
            EVM Contract Changes
          commit-message: "changes for evm contracts"
          token: ${{ secrets.TRIGGER_GH_PAT }}
