[batch_subscriber]
twine_rpc_url = "http://127.0.0.1:8545"
start_block = 1
next_transform_request_id = 0

[consumer]
kafka_broker_url = "localhost:9092"
kafka_topics = "demo"
kafka_groups = "my-group"
auto_offset_reset = "earliest"
# # optional
# security_protocol = "ssl"
# ssl_ca_location = "ca.crt"
# ssl_certificate_location = "user.crt"
# ssl_key_location = "user.key"

[worker_manager]
binding_port = 8000
job_completion_timeout = 30 # secs

[attempt]
max_attempts_per_request = 20
max_consume_attempts_per_attempts = 20

[db]
conn_str = "postgres://twine:twine@localhost:5432/twine"

[processor]
transform_request_channel_size = 100
transform_attempt_channel_size = 100
consume_attempt_channel_size = 100
max_in_process_transform_attempts = 100

[instrumentation]
metrics_server_port = 3000
