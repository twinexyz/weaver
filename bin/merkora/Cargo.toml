[package]
name = "merkora"
version = "0.1.0"
edition = "2021"

[dependencies]
twine-config.workspace = true
twine-db.workspace = true
twine-db-poller.workspace = true
twine-ethereum.workspace = true
twine-evm-contracts.workspace = true
twine-json-rpc-server.workspace = true
twine-merkora-types.workspace = true
twine-solana.workspace = true
twine-twine.workspace = true

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-pubsub.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types.workspace = true
alloy-sol-types.workspace = true
alloy-transport-http.workspace = true
alloy-trie.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
futures = "0.3.31"
reth-primitives.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[[bin]]
name = "merkora"
path = "src/main.rs"

[features]
default = ["event_websocket"]

polling = ["twine-ethereum/polling"]
block_websocket = ["twine-ethereum/block_websocket"]
event_websocket = ["twine-ethereum/event_websocket"]
zkmode = ["twine-db-poller/zkmode"]
