[package]
name = "merkora"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures = "0.3.31"
twine-config.workspace = true
twine-db.workspace = true
twine-merkora-db-poller.workspace = true
twine-merkora-ethereum.workspace = true
twine-merkora-json-rpc-server.workspace = true
twine-merkora-solana.workspace = true
twine-merkora-twine.workspace = true
twine-merkora-types.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[[bin]]
name = "merkora"
path = "src/main.rs"

[features]
default = ["event_websocket"]

polling = ["twine-merkora-ethereum/polling"]
block_websocket = ["twine-merkora-ethereum/block_websocket"]
event_websocket = ["twine-merkora-ethereum/event_websocket"]
zkmode = ["twine-merkora-db-poller/zkmode"]
