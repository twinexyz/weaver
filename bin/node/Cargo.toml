[package]
name = "twine-node"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
clap = { workspace = true }
eyre = { workspace = true }
reth = { workspace = true }
reth-ethereum-payload-builder.workspace = true
reth-exex = { workspace = true }
reth-node-api = { workspace = true }
reth-node-ethereum = { workspace = true }
reth-tracing = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
twine-db-batch = { workspace = true }
twine-executor = { workspace = true, optional = true, default-features = false }
twine-exex = { workspace = true }
twine-rpc = { workspace = true }

[[bin]]
name = "twine-node"
path = "src/main.rs"

[features]
default = ["twine-batch", "mainnet"]
# environment config for twine node
devnet = ["twine-executor/devnet"]
testnet = ["twine-executor/testnet"]
mainnet = ["twine-executor/mainnet"]
# enable batcher
twine-batch = []
